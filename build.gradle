plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		name = "Architectury"
		url = "https://maven.architectury.dev/"
	}
}

loom {
	splitEnvironmentSourceSets()

	runs {
		server {
			// Forward the autotest flag from the Gradle invocation into the game JVM:
			// gradlew runServer -Dminemate.autotest=true
			vmArg "-Dminemate.autotest=${System.getProperty('minemate.autotest', 'false')}"
			vmArg "-Dminemate.autotest.scenario=${System.getProperty('minemate.autotest.scenario', '')}"
		}
	}

	mods {
		"minemate" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Provision everything the headless suite depends on, so it behaves identically on a
// developer's machine and on a clean CI checkout. run/ is gitignored, which means CI
// starts with no server.properties and no eula.txt at all.
def autotestWorldName = 'autotest-world'

tasks.matching { it.name == 'runServer' }.configureEach {
	doFirst {
		if (!Boolean.getBoolean('minemate.autotest')) {
			return
		}
		def runDir = file('run')
		runDir.mkdirs()

		// The dedicated server refuses to boot without this. Accepted deliberately for
		// the automated suite; it is not written for an ordinary runServer.
		new File(runDir, 'eula.txt').text = 'eula=true\n'

		// Merge in only the keys the scenarios depend on, leaving any other local
		// settings alone. A superflat, peaceful world keeps pathfinding and mining
		// deterministic, and the disabled watchdog stops a slow CI runner from being
		// killed mid-scenario.
		def propertiesFile = new File(runDir, 'server.properties')
		def serverProperties = new Properties()
		if (propertiesFile.exists()) {
			propertiesFile.withInputStream { serverProperties.load(it) }
		}
		serverProperties.putAll([
				'level-name'        : autotestWorldName,
				'level-type'        : 'minecraft:flat',
				'generator-settings': '{}',
				'difficulty'        : 'peaceful',
				'spawn-monsters'    : 'false',
				'online-mode'       : 'false',
				'max-tick-time'     : '-1'
		])
		propertiesFile.withOutputStream {
			serverProperties.store(it, 'Managed by the MineMate autotest task')
		}

		// The suite spawns a companion and mines terrain near spawn. Reusing a save lets
		// that damage accumulate until pathfinding scenarios fail for reasons unrelated
		// to the code, so every run starts from a freshly generated world.
		def world = new File(runDir, autotestWorldName)
		if (world.exists()) {
			project.delete(world)
			logger.lifecycle("[autotest] cleared world '${autotestWorldName}' for a reproducible run")
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// PlayerEngine: LivingEntity body + inventory + Baritone-fork navigation (bundled Automatone).
	modImplementation "maven.modrinth:playerengine:${project.playerengine_version}"
	// Architectury API: required at runtime by PlayerEngine.
	modImplementation "dev.architectury:architectury-fabric:${project.architectury_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
